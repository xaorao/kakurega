name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - name: Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt -c clippy && rustup default 1.94.1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Checks
        run: scripts/test
