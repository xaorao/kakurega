name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.1
      - name: Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal -c rustfmt -c clippy && rustup default 1.94.1
      - name: Install
        run: pnpm install --frozen-lockfile
      # the review sandbox shows a program only /usr. As on the machines the tests are written for: the distribution's
      # Node.js at /usr/bin/node (no TypeScript), and a current one with TypeScript at /usr/local/bin/node
      - name: Node where the sandbox can see it
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nodejs
          sudo install -m 755 "$(command -v node)" /usr/local/bin/node
          /usr/bin/node --version && /usr/local/bin/node --version
      # the Rust checks run a compiler inside the sandbox too, so the pinned toolchain is also placed under /usr
      - name: Rust where the sandbox can see it
        run: |
          sudo cp -a "$(rustc --print sysroot)"/. /usr/local/
          sudo ln -sf /usr/local/bin/rustc /usr/bin/rustc
          /usr/bin/rustc --version && /usr/bin/gcc --version | head -1
      # the review tests start the real worker inside the sandbox, so it is built first and named by its full path
      - name: Worker
        run: cargo build --locked -p kk-worker
      - name: Checks
        env:
          KK_WORKER_BIN: ${{ github.workspace }}/target/debug/kk-worker
        run: scripts/test
