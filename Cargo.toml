[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.test]
incremental = false
debug = "line-tables-only"

# third-party code needs no debug information; this keeps the build output several times smaller
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false

# the secret detector is scanned against multi-megabyte inputs in tests that check its work stays bounded;
# optimising this one crate keeps those measurements about the algorithm, not the unoptimised build
[profile.dev.package.kk-secrets]
opt-level = 3

[profile.test.package.kk-secrets]
opt-level = 3

# hashing a whole program file is part of printing an install command; unoptimised it takes seconds in tests
[profile.dev.package.sha2]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3
