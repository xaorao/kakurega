[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
incremental = false
debug = "line-tables-only"

[profile.test]
incremental = false
debug = "line-tables-only"

# third-party code needs no debug information; this keeps the build output several times smaller
[profile.dev.package."*"]
debug = false

[profile.test.package."*"]
debug = false
