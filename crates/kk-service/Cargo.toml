[package]
name = "kk-service"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The product service: review jobs, approvals and delivery behind the companion's HTTP interface"

[dependencies]
kk-types = { path = "../kk-types" }
kk-evidence = { path = "../kk-evidence" }
kk-vault = { path = "../kk-vault" }
kk-memory = { path = "../kk-memory" }
kk-disclosure = { path = "../kk-disclosure" }
kk-eventlog = { path = "../kk-eventlog" }
sha2 = "0.10"
subtle = "2"
kk-effects = { path = "../kk-effects" }
kk-review = { path = "../kk-review" }
kk-route = { path = "../kk-route" }
kk-companion = { path = "../kk-companion" }
kk-sandbox = { path = "../kk-sandbox" }
kk-fetch = { path = "../kk-fetch" }
kk-backup = { path = "../kk-backup" }
kk-secrets = { path = "../kk-secrets" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
kk-tui = { path = "../kk-tui" }
crossterm = "0.28"
kk-eventlog = { path = "../kk-eventlog" }
ureq = { version = "3", default-features = false, features = ["json"] }

[lints]
workspace = true
