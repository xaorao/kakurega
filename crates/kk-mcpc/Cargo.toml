[package]
name = "kk-mcpc"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "MCP client: runs one owner-approved server program as a child process and calls its tools with bounds"

[dependencies]
kk-evidence = { path = "../kk-evidence" }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-async-rw"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "process", "time", "io-util", "sync", "macros"] }

[lints]
workspace = true

[[bin]]
name = "fake_mcp"
path = "src/bin/fake_mcp.rs"
test = false
