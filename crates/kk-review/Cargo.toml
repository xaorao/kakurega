[package]
name = "kk-review"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The code review job: import a repository with labels and a source manifest, run the worker, check the result, prepare the release"

[dependencies]
kk-types = { path = "../kk-types" }
kk-secrets = { path = "../kk-secrets" }
kk-evidence = { path = "../kk-evidence" }
kk-broker = { path = "../kk-broker" }
kk-kernel = { path = "../kk-kernel" }
kk-policy = { path = "../kk-policy" }
kk-run = { path = "../kk-run" }
kk-sandbox = { path = "../kk-sandbox" }
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kk-route = { path = "../kk-route" }

