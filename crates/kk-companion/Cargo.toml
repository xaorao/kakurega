[package]
name = "kk-companion"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The local companion: a loopback-only HTTP service for the web workspace with pairing, server-side sessions and strict origin checks"

[dependencies]
kk-types = { path = "../kk-types" }
kk-evidence = { path = "../kk-evidence" }
kk-vault = { path = "../kk-vault" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
subtle = "2"
tower = { version = "0.5", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "server", "http1", "service"] }

[dev-dependencies]
ureq = { version = "3", default-features = false, features = ["json"] }

[lints]
workspace = true
