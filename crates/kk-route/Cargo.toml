[package]
name = "kk-route"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Model routes: device-only local inference, a deterministic stub for tests, and the no-fallback selection rule"

[dependencies]
kk-types = { path = "../kk-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[lints]
workspace = true
