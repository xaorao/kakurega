[package]
name = "kk-vault"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Encrypted local storage for Kakurega: SQLCipher databases opened only with a raw 256-bit key"

[dependencies]
kk-types = { path = "../kk-types" }
rusqlite = { version = "0.41.1", features = ["bundled-sqlcipher-vendored-openssl", "hooks"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
getrandom = "0.3"

[lints]
workspace = true
