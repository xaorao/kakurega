[package]
name = "kk-parse"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Reads a file the owner attaches, on this computer: text, Word, Excel, PDF and archives become labelled plain text with an anchor for every passage, inside hard limits on size, depth and output"

[dependencies]
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
lopdf = { version = "0.47", default-features = false }
serde_json = "1"

[lints]
workspace = true
