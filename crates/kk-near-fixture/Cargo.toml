[package]
name = "kk-near-fixture"
version.workspace = true
edition.workspace = true
publish = false
description = "A fake NEAR AI Cloud gateway for tests that run without an account. Everything it produces is simulated; it must never be a dependency of a shipped binary."

[dependencies]
nearai-inference-sdk = "=0.3.0"
wiremock = "0.6"
async-trait = "0.1"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
