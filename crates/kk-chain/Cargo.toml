[package]
name = "kk-chain"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The NEAR side of a capsule: reads the registry contract, has NEAR's verifier check a model's hardware quote, and opens and meets orders"

[dependencies]
near-api = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
