[package]
name = "kk-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The kaku command line: serve the local workspace, approve releases in the terminal, verify capsules"

[[bin]]
name = "kaku"
path = "src/main.rs"

[dependencies]
kk-evidence = { path = "../kk-evidence" }
kk-update = { path = "../kk-update" }
kk-fetch = { path = "../kk-fetch" }
kk-eventlog = { path = "../kk-eventlog" }
kk-tui = { path = "../kk-tui" }
kk-companion = { path = "../kk-companion" }
kk-service = { path = "../kk-service" }
kk-memory = { path = "../kk-memory" }
kk-review = { path = "../kk-review" }
kk-route = { path = "../kk-route" }
kk-sandbox = { path = "../kk-sandbox" }
kk-types = { path = "../kk-types" }
kk-parse = { path = "../kk-parse" }
kk-vault = { path = "../kk-vault" }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }

[lints]
workspace = true
