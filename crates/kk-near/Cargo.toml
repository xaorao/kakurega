[package]
name = "kk-near"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "NEAR AI Cloud verification: attestation of model deployments through the official inference SDK, with Kakurega's route policy on top"

[dependencies]
kk-types = { path = "../kk-types" }
kk-route = { path = "../kk-route" }
serde_json = "1"
async-trait = "0.1"
nearai-inference-sdk = "=0.3.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
kk-near-fixture = { path = "../kk-near-fixture" }
kk-types = { path = "../kk-types" }
serde_json = "1"

[lints]
workspace = true
