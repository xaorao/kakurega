[package]
name = "kk-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "The kaku full-screen terminal workspace: a keyboard-first client of the local Kakurega service"

[dependencies]
kk-types = { path = "../kk-types" }
kk-evidence = { path = "../kk-evidence" }
ratatui = "0.29"
crossterm = "0.28"
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "cookies"] }
unicode-width = "0.2"
# the same version the terminal library already brings in; used to ask, safely, whether the terminal is still there
rustix = { version = "0.38", features = ["event"] }

[lints]
workspace = true
